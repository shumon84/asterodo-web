name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本番の起動のしかた（compose.yaml）でビルドして起動し、VPS と同じ形の Traefik から、
  # vps-infra が付けるのと同じラベル（compose.ci.yaml）で HTTPS で転送されることを確かめる。
  # 証明書は取らない（Traefik の仮の証明書で受け、curl -k で確かめない）。入れ替えは vps-infra の CI で確かめている
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Traefik を起動する（VPS の shumon84/vps-infra の公開の入口と同じ形）
        run: |
          docker network create traefik
          docker run -d --name traefik --network traefik -p 127.0.0.1:443:443 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            traefik:v3.7 \
            --providers.docker.exposedbydefault=false \
            --providers.docker.network=traefik \
            --entrypoints.websecure.address=:443 \
            --entrypoints.websecure.http.tls=true

      - name: ビルドして起動する（ヘルスチェックが通るまで待つ）
        run: docker compose up -d --build --wait

      - name: 転送できることを確かめる
        run: |
          get() { curl --silent --show-error --fail -k --resolve "$1:443:127.0.0.1" "https://$1$2"; }
          for i in $(seq 10); do get asterodo.com / -o /dev/null && break; sleep 1; done
          get asterodo.com / | grep -i '<title>'
          # web/ の下のファイルも配れる（日本語の名前も）
          get asterodo.com /css/top.css -o /dev/null
          get asterodo.com /products/oraclamity/resources/damage-calculator/ | grep -i '<html'
          get asterodo.com "/products/oraclamity/img/icon/$(printf '%s' '毒.svg' | jq -sRr @uri)" -o /dev/null
          # ほかの名前では受けない
          test "$(curl --silent -k --resolve other.example:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://other.example/)" = 404

      - name: イメージに起動のしかた（/vps-infra/compose.yaml）が入っている
        run: |
          docker run --rm --entrypoint cat ghcr.io/shumon84/asterodo-web:main /vps-infra/compose.yaml | diff - compose.yaml

      - name: ログを出して止める
        if: always()
        run: |
          docker compose logs
          docker logs traefik
          docker compose down

  # main に入ったら、本番用のイメージを GHCR に置く。VPS の vps-infra のタイマーがこれを見つけて入れ替える（README.md）
  publish:
    needs: [production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: GHCR にログインする
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: イメージを作って置く（main と、コミットごとの sha-xxxxxxx）
        run: |
          image=ghcr.io/${{ github.repository }}
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$image:main" -t "$image:sha-${GITHUB_SHA::7}" .
          docker push --all-tags "$image"
