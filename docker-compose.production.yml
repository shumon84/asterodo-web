# VPS で動かすときの設定。ホストのポートは開けず、VPS の Traefik から転送を受ける（shumon84/vps-infra）
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.asterodo.rule=Host(`asterodo.com`)
      - traefik.http.routers.asterodo.entrypoints=websecure
      # asterodo.com の DNS は Route 53 にない（ムームードメイン）ので、証明書は HTTP で取る（vps-infra の letsencrypt-http）
      - traefik.http.routers.asterodo.tls.certresolver=letsencrypt-http
      - traefik.http.services.asterodo.loadbalancer.server.port=80
    networks:
      - traefik

networks:
  # VPS の Traefik のネットワーク（shumon84/vps-infra が作る）
  traefik:
    external: true
